<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wordcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-controls">
            <select id="listSelector" onchange="changeList()">
                <!-- Dropdown options injected via JavaScript -->
            </select>
            <button class="mode-btn" onclick="toggleSpellingMode()" id="modeToggleBtn">Sight️</button>
            <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle dark mode" id="themeToggleBtn">🌙</button>
        </div>
    </header>

    <div class="carousel-container">
        <div class="carousel-window">
            <div class="card-track" id="cardTrack">
                <!-- Left Card Frame Slot -->
                <div class="flashcard pos-left" id="leftCard">
                    <div class="card-face card-front">
                        <div class="word-display" id="leftWord"></div>
                        <button class="audio-btn">🔊</button>
                    </div>
                </div>

                <!-- Center Main Workspace Card Frame Slot -->
                <div class="flashcard pos-center" id="card" onclick="flipCard()">
                    <!-- Front Face: Shows Word Instantly -->
                    <div class="card-face card-front">
                        <div class="word-display" id="frontWord">Loading...</div>
                        <button class="audio-btn" id="speakWordBtn" onclick="speakWord(event)">🔊</button>
                    </div>
                    <!-- Back Face: Shows Sentence Hint -->
                    <div class="card-face card-back">
                        <div class="hint-display" id="backHint">Sentence context goes here.</div>
                        <button class="audio-btn" id="speakSentenceBtn" onclick="speakSentence(event)">🔊</button>
                    </div>
                </div>

                <!-- Right Card Frame Slot -->
                <div class="flashcard pos-right" id="rightCard">
                    <div class="card-face card-front">
                        <div class="word-display" id="rightWord"></div>
                        <button class="audio-btn">🔊</button>
                    </div>
                </div>

                <!-- temporary card used to maintain the carousel illusion -->
                <div class="flashcard pos-farright" id="tempCard">
                    <div class="card-face card-front">
                        <div class="word-display" id="tempWord"></div>
                        <button class="audio-btn">🔊</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn secondary-btn" onclick="shuffleCurrentList()">🔀 Shuffle</button>
        <button class="nav-btn" onclick="prevCard()">⬅️ Previous</button>
        <button class="nav-btn" onclick="nextCard()">Next ➡️</button>
    </div>

    <div class="progress-text" id="progress">Card 0 of 0</div>
    
    <div class="shortcuts-guide">
        💡 Shortcuts: <b>Space</b> to Flip | <b>Left Arrow</b> for Prev | <b>Right Arrow</b> for Next
    </div>

    <footer>
        <a href="https://github.com/leoclee/wordcards" target="_blank" rel="noopener" aria-label="View source code on GitHub">
            <span>View on GitHub</span>
        </a>
    </footer>

    <!-- Injecting local script data configuration -->
    <script src="words.js"></script>
    <script src="script.js"></script>
</body>
</html>
